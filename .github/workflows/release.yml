name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (optional)"
        required: false
        type: string

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Tag, Build & Push
    runs-on: ubuntu-latest
    needs: [ci]

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate timestamp release tag
        id: tag
        run: |
          TAG="$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short=9 HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Generated tag: $TAG"

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.tag.outputs.tag }}" -m "Release ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: ${{ inputs.notes || format('Release {0}', steps.tag.outputs.tag) }}
          generate_release_notes: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            dcaixinha/pageless:${{ steps.tag.outputs.tag }}
            dcaixinha/pageless:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
