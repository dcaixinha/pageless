# Environment shared by every task (and your shell when mise is active in this
# project). These point the locally-running app at the PostgreSQL instance from
# docker-compose, which publishes the container's 5432 on host port 5433.
[env]
DATABASE_HOST = '127.0.0.1'
DATABASE_PORT = '5433'
DATABASE_USER = 'postgres'
DATABASE_PASSWORD = 'postgres'
DATABASE_NAME = 'pageless_dev'

# Where extracted cover art and other media artifacts are stored on the host.
PAGELESS_MEDIA_PATH = '{{config_root}}/media'

[tasks.db_up]
description = 'Start the PostgreSQL container'
alias = 'dbup'
run = 'docker compose up -d db'

[tasks.db_down]
description = 'Stop the PostgreSQL container'
alias = 'dbdown'
run = 'docker compose stop db'

[tasks.setup]
description = 'Install deps, set up the database and build assets'
alias = 'setp'
run = 'mix setup'

[tasks.server_local]
description = 'Start the development server locally'
alias = 'iexp'
run = 'iex -S mix phx.server'

[tasks.server_lan]
description = "Start the development server bound to all interfaces for phone testing"
alias = 'liexp'
run = "PHX_HOST_IP=0.0.0.0 iex -S mix phx.server"
